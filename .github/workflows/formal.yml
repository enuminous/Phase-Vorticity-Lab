name: Formal source bridge
on: workflow_dispatch
permissions:
  contents: read
jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865
        with:
          lake-package-directory: formal/upstream-analysis
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - run: bash tools/verify_formal.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formal-source-bridge-evidence
          path: evidence/local-formal/
